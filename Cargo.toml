[package]
name = "wsfed-caep"
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["rcbjBlueMars <9321971+rcbjBlueMars@users.noreply.github.com>"]
description = "Server-side WS-Federation relying party"
repository = "https://github.com/rcbj/wsfed-caep-rust"
homepage = "https://github.com/rcbj/wsfed-caep-rust"
documentation = "https://docs.rs/wsfed-caep"
readme = "README.md"
keywords = ["ws-federation", "saml", "caep", "sso"]
categories = ["authentication"]

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
base64 = "0.22"
cbc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cipher = "0.5"
hmac = "0.12"
pem = "3"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
signature = "3"
tiny_http = "0.12"
ua-cryptography-xml-c14n = "0.1.6"
ureq = "3.5"
url = "2"
webpki-roots = "1.0"
x509-parser = "0.16"

[[bin]]
name = "wsfed-demo"
path = "src/bin/wsfed-demo.rs"

[[bin]]
name = "wsfed-caep"
path = "src/bin/wsfed-caep.rs"
