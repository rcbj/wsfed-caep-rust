name: Publish

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    # Tests has already succeeded for this commit on main. Publish only
    # when that commit is a pull request merged into main. A direct push
    # stays unpublished. The checkout is the commit tests ran, and a
    # version already on crates.io is left there.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require a pull request merged into main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$count" = "0" ]; then
            echo "This commit on main did not come from a merged pull request."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Publish the crate
        if: steps.gate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          python3 - <<'PY'
          import tomllib
          pkg = tomllib.load(open("Cargo.toml", "rb"))["package"]
          with open("/tmp/crate-id", "w", encoding="utf-8") as fh:
              fh.write(pkg["name"] + "\n" + pkg["version"] + "\n")
          PY
          name=$(sed -n '1p' /tmp/crate-id)
          version=$(sed -n '2p' /tmp/crate-id)
          code=$(curl -sS -o /tmp/crate-version.json -w '%{http_code}' \
            -A "rcbjBlueMars (${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/${name}/${version}")
          if [ "$code" = "200" ]; then
            echo "${name} ${version} is already on crates.io."
            exit 0
          fi
          if [ "$code" != "404" ]; then
            echo "crates.io returned ${code} for ${name} ${version}."
            python3 -c 'print(open("/tmp/crate-version.json", encoding="utf-8").read()[:500])'
            exit 1
          fi
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            -e CARGO_REGISTRY_TOKEN \
            rust:1-bookworm \
            cargo publish --locked
